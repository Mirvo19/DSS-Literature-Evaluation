<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DSS Talk</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title" data-i18n="signup">Sign Up</h1>

            <div id="errorMessage" class="alert alert-error hidden"></div>
            <div id="successMessage" class="alert alert-success hidden"></div>

            <form id="signupForm">
                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label" data-i18n="email">Email</label>
                    <input type="email" id="email" class="form-input" data-i18n-placeholder="email" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input type="password" id="password" class="form-input" data-i18n-placeholder="password" required
                        minlength="6">
                    <span class="form-help" data-i18n="passwordTooShort">Password must be at least 6 characters</span>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label" data-i18n="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input"
                        data-i18n-placeholder="confirmPassword" required minlength="6">
                    <span id="passwordError" class="form-error hidden" data-i18n="passwordMismatch">Passwords do not
                        match</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="signupButton">
                    Sign Up
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    <span data-i18n="alreadyHaveAccount">Already have an account?</span>
                    <a href="/" data-i18n="login">Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        // Initialize language
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('language') || 'en';

            // Update all texts with current language
            i18n.updatePageTexts();

            const loginLink = document.querySelector('.auth-footer a');
            if (loginLink) {
                loginLink.href = '/' + lang + '/login';
            }

            // Form validation
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const passwordError = document.getElementById('passwordError');

            function validatePasswords() {
                if (password.value && confirmPassword.value) {
                    if (password.value !== confirmPassword.value) {
                        passwordError.classList.remove('hidden');
                        return false;
                    } else {
                        passwordError.classList.add('hidden');
                        return true;
                    }
                }
                return true;
            }

            password.addEventListener('input', validatePasswords);
            confirmPassword.addEventListener('input', validatePasswords);

            // Form submission
            const form = document.getElementById('signupForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Hide messages
                errorMessage.classList.add('hidden');
                successMessage.classList.add('hidden');

                // Validate passwords match
                if (!validatePasswords()) {
                    const errorMsg = i18n.t('passwordMismatch');
                    Toast.error(errorMsg);
                    errorMessage.textContent = errorMsg;
                    errorMessage.classList.remove('hidden');
                    return;
                }

                // Get form data
                const email = document.getElementById('email').value;
                const pwd = password.value;

                // Show loading
                loadingOverlay.classList.remove('hidden');

                try {
                    const result = await auth.signup(email, pwd);
                    const verificationMsg = i18n.t('checkInboxVerification');

                    // Show Toast notification immediately
                    Toast.success(verificationMsg, 'Check Your Inbox', 6000);

                    // Queue toast for login page redirect
                    Toast.queue({
                        type: 'info',
                        title: 'Email Verification',
                        message: verificationMsg,
                        duration: 7000
                    });

                    successMessage.textContent = verificationMsg;
                    successMessage.classList.remove('hidden');

                    // Redirect to login after delay
                    setTimeout(() => {
                        window.location.href = '/' + lang + '/login';
                    }, 2200);

                } catch (error) {
                    // Show error toast
                    const errMsg = error.message || 'Signup failed';
                    Toast.error(errMsg, 'Signup Error');
                    errorMessage.textContent = errMsg;
                    errorMessage.classList.remove('hidden');
                    loadingOverlay.classList.add('hidden');
                }
            });

            // If already logged in, redirect to dashboard
            if (auth.isAuthenticated()) {
                window.location.href = '/' + lang + '/dashboard';
            }
        });
    </script>
</body>

</html>
